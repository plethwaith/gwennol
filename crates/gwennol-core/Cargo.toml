[package]
name = "gwennol-core"
description = "The Gwennol agent loop and the contracts it consumes: a session against an LLM_CHAT provider and TOOL plugins on any Gwead kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["agent", "llm", "wasm", "gwead"]
categories = ["development-tools"]

[dependencies]
# Writes an image block's `data` (standard padded base64).
base64 = "0.22"
gwead.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# The same JSON Schema validator Gwead uses for its meta-schemas. The
# agent loop checks model-emitted tool arguments against each tool's
# declared schema before dispatching — the one payload validation the
# SPI contracts assign to the caller, since the kernel does none.
boon = "0.6"

[dev-dependencies]
serde_json.workspace = true
