[package]
name = "gwennol-core"
description = "Gwennol host library: Gwead kernel configuration, native host step types, bundled SPI manifests, the agent loop, and the Operator trait that frontends implement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["agent", "llm", "wasm", "gwead"]
categories = ["development-tools"]

[dependencies]
gwead.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true
reqwest.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
tempfile = "3"
async-trait.workspace = true
# Guest wasm modules travel inline in plugin manifests as base64; the
# substrate tests encode the compiled example guest with it.
base64 = "0.22"
# The substrate tests pin gwennol-guest's re-declared STREAM_* codes
# against gwead's, and build the example guest's manifest from the
# names sse-guest itself exports. Path-only dev-dependencies, stripped
# by `cargo package`.
gwennol-guest = { path = "../gwennol-guest" }
sse-guest = { path = "../sse-guest" }
# The same JSON Schema validator Gwead uses for its meta-schemas; here it
# pins fixture payloads to the SPI contract schemas, which the kernel
# deliberately never does at dispatch.
boon = "0.6"
