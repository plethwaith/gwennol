[package]
name = "gwennol-cli"
description = "Gwennol command-line frontend: an interactive session, or one task with -p."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
# Named `gwennol`, not `gwennol_cli`, so `module_path!()` — and every
# `tracing` target the host's log carries — stays `gwennol::...` as it
# was when this crate was a binary alone.
name = "gwennol"
path = "src/lib.rs"

[[bin]]
name = "gwennol"
path = "src/main.rs"

[dependencies]
gwennol-core = { path = "../gwennol-core" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The trace scrubs URLs the way the host does, through the same
# function, and needs the parsed form to hand it.
url.workspace = true
# Ctrl-C is the one interactive thing a headless run answers to: it
# cancels the turn through the loop's token.
tokio = { workspace = true, features = ["signal"] }
clap = { version = "4.5", features = ["derive", "env"] }
# Rule patterns are globs over paths, argv and URLs.
globset = "0.4"
toml = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The interactive frontend's screen: raw mode, the alternate screen,
# bracketed paste, the kitty keyboard protocol, and its key events.
crossterm = { version = "0.29", features = ["event-stream"] }
# The interactive frontend's panes and status line, over the pinned
# crossterm backend above.
ratatui = "0.30"
# `StreamExt::next` on crossterm's `EventStream`; already in the lock
# via reqwest.
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
# The headless suite bundles the committed plugins through the same
# code `cargo xtask bundle` runs and drives the built binary against a
# stub Messages API. Path-only.
#
# Neither `provider-anthropic` nor `tool-edit` is a dev-dependency here:
# both are guest crates that invoke `gwennol_guest::entrypoints!`, which
# emits `#[no_mangle] alloc`/`execute` per crate, and this crate's test
# binaries used to link both rlibs together — a duplicate-symbol error,
# the trap this crate's `headless` binary hit on Linux (never on
# macOS). `xtask`'s bundler compiles each guest crate to wasm without
# linking its rlib into the host binary, so the suites reach the
# committed manifests' own values instead of a Rust copy the guest
# crates used to export.
xtask = { path = "../xtask" }
tempfile = "3"
