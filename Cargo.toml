[workspace]
resolver = "3"
members = [
    "crates/gwennol-core",
    "crates/gwennol-cli",
    "crates/gwennol-guest",
    "crates/sse-guest",
    "crates/provider-anthropic",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/plethwaith/gwennol"
homepage = "https://gwennol.dev"
authors = ["Plethwaith Labs <hello@plethwaith.com>"]

[workspace.dependencies]
gwead = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "fs", "process", "time"] }
tracing = "0.1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
url = "2"
nix = { version = "0.30", default-features = false, features = ["signal"] }
